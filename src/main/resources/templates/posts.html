<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Posts</title>
</head>
<body>

<h1>Posts</h1>

<div th:each="post : ${posts}">
    <h2 th:text="${post.title}">Post title</h2>
    <p th:text="${post.body}">Post body</p>

    <h3>Comments</h3>

    <ul>
        <li th:each="comment : ${post.comments}"
            th:text="${comment.content}">
            Comment content
        </li>
    </ul>

    <hr>
</div>

</body>
</html>
